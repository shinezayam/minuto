services:
  - type: web
    name: minuto-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: CORS_ORIGINS
        value: https://mongolian-ai-minutes.vercel.app,http://localhost:3000
      - key: ASR_PROVIDER
        value: demo
      - key: AUDIO_STORAGE_PATH
        value: ./audio_storage
      - key: MAX_AUDIO_CHUNK_BYTES
        value: 5000000
