services:
  - type: web
    name: minuto-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: CORS_ORIGINS
        value: https://minuto-frontend.vercel.app,https://mongolian-ai-minutes.vercel.app,http://localhost:3000
      # omni = Qwen-Omni API (free plan-ий 512MB RAM-д багтана). whisper medium-д 2GB+ RAM хэрэгтэй.
      - key: ASR_PROVIDER
        value: omni
      - key: LLM_PROVIDER
        value: qwen
      - key: QWEN_BASE_URL
        value: https://tokenhub.mn/v1
      - key: QWEN_MODEL
        value: qwen3.7-plus
      - key: OMNI_MODEL
        value: qwen3.8-omni-flash
      # Нууц — Render dashboard дээр гараар оруулна, git-д бичихгүй
      - key: QWEN_API_KEY
        sync: false
      # Хурал, хэрэглэгчийн мэдээлэл — доорх Postgres-д хадгалагдана
      - key: DATABASE_URL
        fromDatabase:
          name: minuto-db
          property: connectionString
      # Нэвтрэлтийн токены нууц — Render нэг удаа санамсаргүйгээр үүсгэнэ
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIO_STORAGE_PATH
        value: ./audio_storage
      - key: MAX_AUDIO_CHUNK_BYTES
        value: 5000000

databases:
  # Render-ийн үнэгүй Postgres 30 хоногийн дараа дуусдаг — жинхэнэ хэрэглээнд төлбөртэй багц эсвэл өөр сервер
  - name: minuto-db
    plan: free
    databaseName: minuto
    user: minuto
