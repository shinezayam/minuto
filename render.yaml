# ⚠ ЛАВЛАГАА. Production (minuto-ai-meeting-assistant) нь Render dashboard дээр гараар тохируулагдсан бөгөөд энэ файлаас
# ялгаатай (нэр, plan, диск, env). Dashboard дээр "Blueprint sync" БҮҮ ДАР — тохиргоог энэ файлын утгаар дарж бичнэ.
services:
  - type: web
    name: minuto-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://minuto-frontend.vercel.app,https://mongolian-ai-minutes.vercel.app,http://localhost:3000
      # omni = Qwen-Omni API (free plan-ий 512MB RAM-д багтана). whisper medium-д 2GB+ RAM хэрэгтэй.
      - key: ASR_PROVIDER
        value: omni
      - key: LLM_PROVIDER
        value: qwen
      - key: QWEN_BASE_URL
        value: https://tokenhub.mn/v1
      - key: QWEN_MODEL
        value: qwen3.8-max
      - key: OMNI_MODEL
        value: qwen3.8-omni-flash
      # Нууц — Render dashboard дээр гараар оруулна, git-д бичихгүй
      - key: QWEN_API_KEY
        sync: false
      # Хурал, хэрэглэгчийн мэдээлэл — доорх Postgres-д хадгалагдана
      - key: DATABASE_URL
        fromDatabase:
          name: minuto-db
          property: connectionString
      # Нэвтрэлтийн токены нууц — Render нэг удаа санамсаргүйгээр үүсгэнэ
      - key: JWT_SECRET
        generateValue: true
      # Байнгын аудио хадгалалт: Supabase-д private bucket үүсгэж, доорх 3 нууцыг dashboard дээр оруулаад AUDIO_STORAGE_BACKEND=supabase болго
      # - key: AUDIO_STORAGE_BACKEND
      #   value: supabase
      # - key: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_AUDIO_BUCKET  (sync: false)
      # Billing (docs/BILLING.md): off → shadow (1 долоо хоног ажиглах) → enforce. Түлхүүрүүд dashboard дээр гараар.
      # Утгыг dashboard дээр удирдана (sync: false) — Blueprint sync production-ий утгыг дарж бичихгүй
      - key: BILLING_METERING
        sync: false
      - key: BILLING_CHECKOUT_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: WIRE_API_KEY
        sync: false
      - key: WIRE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUDIO_STORAGE_PATH
        value: ./audio_storage
      - key: MAX_AUDIO_CHUNK_BYTES
        value: 5000000

databases:
  # Render-ийн үнэгүй Postgres 30 хоногийн дараа дуусдаг — жинхэнэ хэрэглээнд төлбөртэй багц эсвэл өөр сервер
  - name: minuto-db
    plan: free
    databaseName: minuto
    user: minuto
